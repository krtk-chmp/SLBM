name: Daily SLBM data pull
on:
  schedule:
    - cron: "30 15 * * *"   # 9:00 PM IST — main run, after NSE publishes
    - cron: "30 19 * * *"   # 1:00 AM IST — safety net for late or failed files
  workflow_dispatch:            # lets you run it manually from the Actions tab
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow clone has no parent commit, so "commit --amend" rewrites the
          # root commit and the force-push is rejected as "stale info". Full history
          # is what makes the amend-in-place strategy work at all.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install curl_cffi pandas
      - run: python run_daily.py
      - name: Commit updated database
        run: |
          git config user.name "slbm-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/slbm.db
          if git diff --cached --quiet; then
            echo "No data change today (holiday, or files not published yet)."
            exit 0
          fi
          if [ "$(git log -1 --pretty=%an)" = "slbm-bot" ]; then
            # Replace yesterday's data commit rather than stacking a ~90 MB blob daily.
            git commit --amend -m "data: $(date +%F)"
            if git push --force-with-lease origin main; then
              echo "Amended yesterday's data commit."
            else
              echo "Amend push rejected. Falling back to a normal commit so the data still lands."
              git fetch origin main
              git reset --soft origin/main
              git commit -m "data: $(date +%F)"
              git push origin main
            fi
          else
            # Newest commit is a human's, so don't touch it — add a fresh commit.
            git commit -m "data: $(date +%F)"
            git push origin main
          fi
