name: Backfill index history (manual)
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days of index history to fetch"
        default: "1830"
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install curl_cffi pandas
      - run: python backfill_index.py ${{ github.event.inputs.days }}
      - name: Commit index history
        run: |
          git config user.name "slbm-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/slbm.db
          if git diff --cached --quiet; then
            echo "No new index data to commit."
            exit 0
          fi
          # commit BEFORE pulling: git refuses to rebase with staged changes
          git commit -m "index history backfill"
          git push || {
            echo "Push rejected, rebasing onto latest main and retrying."
            git fetch origin main
            git rebase -X theirs origin/main
            git push
          }
